[package]
name = "nameshot"
version = "0.1.0"
edition = "2024"

[profile.release]
# Small, fast binary: strip symbols, LTO across the huge `windows` crate
# bindings, single codegen unit. opt-level 3 stays (raster/paint bound),
# panic=unwind stays (Backtrace on the panic path in main.rs).
strip = true
lto = true
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Variant", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# M1 (Linux X11 only): pure-Rust protocol/codec crates, none linked into the
# Windows build. Rationale table in docs/CROSS_PLATFORM_PLAN.md §7.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["randr"] } # X11 protocol client — no libX11, no Xlib, no bindgen
png = "0.18"     # PNG encode (plan §7 "proposed"): replaces WIC off-Windows
ab_glyph = "0.2" # text raster (plan §7 "proposed, quality spike pending")
